<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fintech - Dashboard</title>

  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Seu CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-fintech">

  <main class="d-flex justify-content-center align-items-center min-vh-100">
    <section class="fintech-card shadow-lg p-4 p-md-5">
      <!-- LOGO -->
      <header class="text-center mb-4">
        <h1 class="fintech-logo mb-0">FINTECH</h1>
      </header>

      <!-- TÍTULO DA PÁGINA -->
      <h2 class="fintech-section-title text-center mb-4">
        DASHBOARD
      </h2>

      <!-- CARDS RESUMO -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-4">
          <div class="summary-card summary-card--green">
            <span class="summary-label">ENTRADAS</span>
            <span class="summary-value">R$ 5.500,00</span>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="summary-card summary-card--red">
            <span class="summary-label">SAÍDAS</span>
            <span class="summary-value">R$ 2.100,00</span>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="summary-card summary-card--blue">
            <span class="summary-label">RESTANTE</span>
            <span class="summary-value">R$ 3.400,00</span>
          </div>
        </div>
      </div>

      <!-- CARD PRINCIPAIS GASTOS -->
      <div class="card gastos-card border-0 shadow-sm">
        <div class="card-body">
          <h3 class="gastos-title mb-3">PRINCIPAIS GASTOS</h3>

          <div class="row align-items-center">
            <div class="col-4 col-md-3 text-center mb-3 mb-md-0">
              <div class="pie-chart mx-auto"></div>
            </div>

            <div class="col-8 col-md-9">
              <ul class="list-unstyled mb-3 gastos-list small">
                <li>
                  <span class="gasto-dot"></span>
                  Alimentação: R$ 800,00
                </li>
                <li>
                  <span class="gasto-dot"></span>
                  Transporte: R$ 450,00
                </li>
                <li>
                  <span class="gasto-dot"></span>
                  Transpria: R$ 600,00
                </li>
                <li>
                  <span class="gasto-dot"></span>
                  Outros: R$ 250,00
                </li>
              </ul>

              <a href="#" class="gastos-link">Ver detalhes</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS (apenas para componentes que precisarem) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
